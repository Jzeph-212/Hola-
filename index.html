    "Que esta nueva etapa te abrace con salud, paz y mucha alegría. Que cada sueño que guardas en el corazón encuentre su momento de florecer, y que nunca te falte el amor del bueno.",
    "Estos treinta son solo el comienzo de todo lo hermoso que viene. Y como tu nombre lo dice, hoy te toca ser la reina del día 👑 ¡Feliz cumpleaños, Reyna!"
  ],

  firma: "Con mucho cariño,\nJesús",   // \n hace un salto de línea

  // Tres deseos (ícono + texto corto)
  deseos: [
    { icono: "💛", texto: "Mucha felicidad" },
    { icono: "🌟", texto: "Sueños cumplidos" },
    { icono: "👑", texto: "Un día de reina" }
  ]
};
</script>

<script>

/* ── Confeti ── */
function confetti(duration) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('confetti'), ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const colors = ['#FF5C7A', '#FFC53D', '#4FD6B5', '#7C5CFF', '#FF8A3D', '#FFFFFF'];
  const pieces = Array.from({ length: 150 }, () => ({
    x: Math.random() * c.width,
    y: -20 - Math.random() * c.height * 0.6,
    w: 6 + Math.random() * 6,
    h: 9 + Math.random() * 9,
    vx: -1.2 + Math.random() * 2.4,
    vy: 2 + Math.random() * 3.5,
    r: Math.random() * 6,
    vr: -0.2 + Math.random() * 0.4,
    col: colors[Math.floor(Math.random() * colors.length)]
  }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.col; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (t - t0 < duration) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, c.width, c.height);
  })(t0);
}

/* ── Confeti dorado de la portada ── */
const goldConfetti = (function () {
  const sec = document.getElementById('opening');
  const cv = document.getElementById('goldConfetti');
  if (!sec || !cv) return { start() {} };
  const ctx = cv.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cols = ['#f6d77a', '#e8b655', '#fff1c1', '#c9922f', '#ffe9a8', '#d9a441'];
  let W = 0, H = 0, pieces = [], running = false, started = false, visible = true;

  function make(initial) {
    return {
      x: Math.random() * W,
      y: initial ? Math.random() * H : -14 - Math.random() * 60,
      w: 3 + Math.random() * 5, h: 5 + Math.random() * 9,
      vy: 0.5 + Math.random() * 1.1, vx: -0.25 + Math.random() * 0.5,
      r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.05,
      ph: Math.random() * 6.28,
      col: cols[Math.floor(Math.random() * cols.length)],
      a: 0.55 + Math.random() * 0.45
    };
  }
  function resize() {
    const r = sec.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(90, Math.max(35, W / 12)));
    pieces = Array.from({ length: n }, () => make(true));
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const p of pieces) {
      p.y += p.vy; p.x += p.vx + Math.sin(p.ph += 0.02) * 0.25; p.r += p.vr;
      if (p.y > H + 14) Object.assign(p, make(false));
      ctx.save();
      ctx.globalAlpha = p.a;
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.scale(1, Math.cos(p.ph * 1.3));
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
  }
  function loop() { if (!running) return; draw(); requestAnimationFrame(loop); }
  function go() { if (running || reduce || !started || !visible) return; running = true; requestAnimationFrame(loop); }

  resize();
  window.addEventListener('resize', resize);
  // se pausa cuando la portada no se ve (ahorra batería)
  new IntersectionObserver(entries => {
    visible = entries[0].isIntersecting;
    if (visible) go(); else running = false;
  }).observe(sec);

  return { start() { started = true; if (reduce) draw(); go(); } };
})();

});

/* ── Video de intro ── */
const intro = document.getElementById('intro');
const vid = document.getElementById('introVideo');
const bar = document.getElementById('introBar');
const soundBtn = document.getElementById('soundBtn');
const skipBtn = document.getElementById('skipBtn');
const playBtn = document.getElementById('playBtn');
let closed = false;

function closeIntro() {
  if (closed) return;
  closed = true;
  vid.pause();
  intro.classList.add('hide');
  document.body.classList.remove('locked');
  document.body.classList.add('revealed');
  window.scrollTo(0, 0);
  setTimeout(() => intro.remove(), 900);
  confetti(4000);
  goldConfetti.start();
}

vid.addEventListener('ended', closeIntro);
vid.addEventListener('error', closeIntro);          // si no existe intro.mp4, pasa directo a la página
skipBtn.addEventListener('click', closeIntro);
vid.addEventListener('timeupdate', () => {
  if (vid.duration) bar.style.width = (vid.currentTime / vid.duration * 100) + '%';
});

soundBtn.addEventListener('click', () => {
  vid.muted = false;
  soundBtn.hidden = true;
  vid.play();
});

playBtn.addEventListener('click', () => {
  vid.muted = false;
  soundBtn.hidden = true;
  playBtn.hidden = true;
  vid.play();
});

// Si el navegador bloquea el autoplay, se muestra un botón grande para iniciar
const started = vid.play();
if (started && started.catch) started.catch(() => { playBtn.hidden = false; });

// Si el video tarda demasiado en cargar, no dejamos esperando
setTimeout(() => { if (!closed && vid.readyState < 2) closeIntro(); }, 8000);
</script>

</body>
</html>
