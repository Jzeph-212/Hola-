<!-- ═══════════════════════════════════════════
     3) AQUÍ CAMBIAS LOS TEXTOS DE LA FELICITACIÓN
        Solo edita lo que está entre comillas.
     ═══════════════════════════════════════════ -->
<script>
const CONFIG = {
  nombre: "Reyna",                     // Nombre de quien cumple años
  edad:   "30",                        // Años que cumple
  saludo: "Querida Reyna,",            // Cómo empieza la carta

  // Cada línea entre comillas es un párrafo de la carta
  mensaje: [
    "Hoy el mundo celebra algo muy bonito: que tú llegaste a él. Treinta años de risas, de aprendizajes y de caminos recorridos con una fuerza que inspira.",
    "Eres de esas personas que dejan luz por donde pasan. Tu forma de ser, tu corazón noble y tu sonrisa hacen mejores los días de quienes te rodean. Gracias por ser como eres.",
    "Que esta nueva etapa te abrace con salud, paz y mucha alegría. Que cada sueño que guardas en el corazón encuentre su momento de florecer, y que nunca te falte el amor del bueno.",
    "Estos treinta son solo el comienzo de todo lo hermoso que viene. Y como tu nombre lo dice, hoy te toca ser la reina del día 👑 ¡Feliz cumpleaños, Reyna!"
  ],

  firma: "Con mucho cariño,\nJesús",   // \n hace un salto de línea

  // Tres deseos (ícono + texto corto)
  deseos: [
    { icono: "💛", texto: "Mucha felicidad" },
    { icono: "🌟", texto: "Sueños cumplidos" },
    { icono: "👑", texto: "Un día de reina" }
  ]
};
</script>

<script>
/* ── Rellenar textos desde CONFIG ── */
document.querySelectorAll('[data-fill]').forEach(el => {
  el.textContent = CONFIG[el.dataset.fill];
});
CONFIG.mensaje.forEach(txt => {
  const p = document.createElement('p');
  p.textContent = txt;
  document.getElementById('letterBody').appendChild(p);
});
CONFIG.deseos.forEach(d => {
  const div = document.createElement('div');
  div.className = 'wish';
  div.innerHTML = '<span aria-hidden="true"></span><p></p>';
  div.querySelector('span').textContent = d.icono;
  div.querySelector('p').textContent = d.texto;
  document.getElementById('wishStrip').appendChild(div);
});
document.title = '¡Feliz cumpleaños, ' + CONFIG.nombre + '!';

/* ── Confeti ── */
function confetti(duration) {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.getElementById('confetti'), ctx = c.getContext('2d');
  c.width = innerWidth; c.height = innerHeight;
  const colors = ['#FF5C7A', '#FFC53D', '#4FD6B5', '#7C5CFF', '#FF8A3D', '#FFFFFF'];
  const pieces = Array.from({ length: 150 }, () => ({
    x: Math.random() * c.width,
    y: -20 - Math.random() * c.height * 0.6,
    w: 6 + Math.random() * 6,
    h: 9 + Math.random() * 9,
    vx: -1.2 + Math.random() * 2.4,
    vy: 2 + Math.random() * 3.5,
    r: Math.random() * 6,
    vr: -0.2 + Math.random() * 0.4,
    col: colors[Math.floor(Math.random() * colors.length)]
  }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, c.width, c.height);
    pieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.col; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    if (t - t0 < duration) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, c.width, c.height);
  })(t0);
}

/* ── Soplar la vela ── */
document.getElementById('blowBtn').addEventListener('click', e => {
  document.getElementById('flame').textContent = '💨';
  document.getElementById('cake').classList.add('blown');
  document.getElementById('candleText').textContent = '¡Que se cumpla todo lo que deseaste! ✨';
  e.currentTarget.hidden = true;
  confetti(4500);
});

/* ── Video de intro ── */
const intro = document.getElementById('intro');
const vid = document.getElementById('introVideo');
const bar = document.getElementById('introBar');
const soundBtn = document.getElementById('soundBtn');
const skipBtn = document.getElementById('skipBtn');
const playBtn = document.getElementById('playBtn');
let closed = false;

function closeIntro() {
  if (closed) return;
  closed = true;
  vid.pause();
  intro.classList.add('hide');
  document.body.classList.remove('locked');
  document.body.classList.add('revealed');
  window.scrollTo(0, 0);
  setTimeout(() => intro.remove(), 900);
  confetti(4000);
}

vid.addEventListener('ended', closeIntro);
vid.addEventListener('error', closeIntro);          // si no existe intro.mp4, pasa directo a la página
skipBtn.addEventListener('click', closeIntro);
vid.addEventListener('timeupdate', () => {
  if (vid.duration) bar.style.width = (vid.currentTime / vid.duration * 100) + '%';
});

soundBtn.addEventListener('click', () => {
  vid.muted = false;
  soundBtn.hidden = true;
  vid.play();
});

playBtn.addEventListener('click', () => {
  vid.muted = false;
  soundBtn.hidden = true;
  playBtn.hidden = true;
  vid.play();
});

// Si el navegador bloquea el autoplay, se muestra un botón grande para iniciar
const started = vid.play();
if (started && started.catch) started.catch(() => { playBtn.hidden = false; });

// Si el video tarda demasiado en cargar, no dejamos esperando
setTimeout(() => { if (!closed && vid.readyState < 2) closeIntro(); }, 8000);
</script>
